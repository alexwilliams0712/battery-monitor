[package]
name = "battery-monitor"
version = "0.3.0"
edition = "2024"
description = "Tray icon showing battery levels of wireless peripherals"
authors = ["alexwilliams0712"]
publish = false
license = "PolyForm-Strict-1.0.0"
repository = "https://github.com/alexwilliams0712/battery-monitor"

[dependencies]
anyhow = "1.0.104"
futures-lite = "2"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-hid = { version = "0.5.3", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
async-hid = { version = "0.5.3", default-features = false }
tao = "0.37.2"
tray-icon = "0.26.1"

[package.metadata.deb]
section = "utils"
depends = "$auto, upower"
assets = [
    ["target/release/battery-monitor", "usr/bin/", "755"],
    ["battery-monitor.desktop", "etc/xdg/autostart/", "644"],
    ["README.md", "usr/share/doc/battery-monitor/", "644"],
]
