[package]
name = "battery-monitor"
version = "0.1.0"
edition = "2024"
description = "Tray icon showing battery levels of wireless peripherals"
authors = ["alexwilliams0712"]
publish = false
license = "PolyForm-Strict-1.0.0"
repository = "https://github.com/alexwilliams0712/battery-monitor"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[package.metadata.deb]
section = "utils"
depends = "$auto, upower"
assets = [
    ["target/release/battery-monitor", "usr/bin/", "755"],
    ["battery-monitor.desktop", "etc/xdg/autostart/", "644"],
    ["README.md", "usr/share/doc/battery-monitor/", "644"],
]
