[package]
name = "logi-battery-tray"
version = "0.1.0"
edition = "2024"
description = "Tray icon showing battery levels of wireless peripherals"
license = "PolyForm-Strict-1.0.0"
repository = "https://github.com/alexwilliams0712/logi-battery-tray"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[package.metadata.deb]
section = "utils"
depends = "$auto, upower"
assets = [
    ["target/release/logi-battery-tray", "usr/bin/", "755"],
    ["logi-battery-tray.desktop", "etc/xdg/autostart/", "644"],
    ["README.md", "usr/share/doc/logi-battery-tray/", "644"],
]
